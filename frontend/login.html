<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登入｜行銷案件生命跡象觀測中心</title>
<style>
:root{color-scheme:light;--text:#4A2F4F;--muted:#77607A;--accent:#B83B74;--line:#F4DEE7}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"DM Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--text);
  background:radial-gradient(circle at 84% 2%,#ffeae2,transparent 36%),radial-gradient(circle at 28% 70%,#fbe9f8,transparent 46%),linear-gradient(130deg,#fff0f4,#fff8fa 55%,#fbf6ff)}
form{background:#ffffffd9;border:1px solid #fff;border-radius:24px;box-shadow:0 16px 40px #d58bab22;padding:28px;width:min(360px,calc(100vw - 32px));display:grid;gap:14px;box-sizing:border-box}
h1{font-size:20px;margin:0}
p{margin:0;font-size:13px;color:var(--muted)}
label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
input{font:inherit;color:inherit;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff}
button{font:inherit;font-weight:700;border:0;border-radius:50px;padding:10px;cursor:pointer;color:#5A1030;background:linear-gradient(145deg,#ffa9c2,#ffc6bd)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#err{color:#C2334A}
</style>
</head>
<body>
<form id="f">
  <div><h1>行銷案件生命跡象觀測中心 ✳</h1><p>專門確認每個案件還活著嗎</p></div>
  <label>帳號<input id="u" autocomplete="username" required></label>
  <label>密碼<input id="p" type="password" autocomplete="current-password" required></label>
  <button type="submit">登入</button>
  <p id="err" hidden></p>
</form>
<script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('err');err.hidden=true;
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
  if(r.ok)location.href='/';else{err.textContent='帳號或密碼不對，請再試一次。';err.hidden=false}};
</script>
</body>
</html>
